# ============================================================================
# Development Fallback Profile ('dev')
# Uses a local file-backed H2 database when PostgreSQL is not installed.
# Do NOT use this profile for production. Use the 'postgres' profile instead.
# ============================================================================
spring:
  datasource:
    url: jdbc:h2:file:./data/smart-fridge-dev;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
